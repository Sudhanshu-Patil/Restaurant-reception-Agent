<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restaurant Reception Agent</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222c; --border: #2a2f3a;
    --text: #e7e9ee; --muted: #9aa3b2; --accent: #ff8a5c; --accent-2: #6ea8fe;
    --user: #26303f; --agent: #1c2530;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .who { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  label.toggle { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  button {
    background: var(--accent); color: #1a1206; border: 0; border-radius: 8px;
    padding: 9px 16px; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; overflow-y: auto; padding: 22px; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  /* identity gate */
  .gate { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
  .gate h2 { margin: 0 0 6px; font-size: 17px; }
  .gate p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .gate .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .gate input {
    flex: 1; min-width: 180px; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 14px;
  }
  .gate .err { color: #ff6b6b; font-size: 13px; min-height: 18px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .hint code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }

  /* messages */
  .msg { display: flex; gap: 10px; }
  .msg .bubble { padding: 11px 14px; border-radius: 12px; max-width: 78%; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: var(--user); border: 1px solid var(--border); }
  .msg.agent .bubble { background: var(--agent); border: 1px solid var(--border); }
  .msg .role { font-size: 11px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .04em; }
  .trace {
    max-width: 78%; background: #12151c; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted); white-space: pre-wrap; overflow-x: auto;
  }
  .system { text-align: center; color: var(--muted); font-size: 13px; }

  /* composer */
  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 14px 20px; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  .composer textarea {
    flex: 1; resize: none; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 13px; font: inherit; max-height: 140px;
  }
  .dots::after { content: "…"; animation: d 1.2s steps(4, end) infinite; }
  @keyframes d { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
</style>
</head>
<body>
<header>
  <h1>🍽️ Reception Agent</h1>
  <span class="who" id="who"></span>
  <span class="spacer"></span>
  <label class="toggle" id="verboseWrap" hidden>
    <input type="checkbox" id="verbose" /> show reasoning trace
  </label>
  <button class="ghost" id="reset" hidden>New session</button>
</header>

<main>
  <div class="wrap" id="wrap">
    <div class="gate" id="gate">
      <h2>Who's calling?</h2>
      <p>Identify yourself by phone or email so the agent can pull up your preferences and history.</p>
      <div class="row">
        <input id="phone" placeholder="Phone (e.g. +91-9876543210)" autocomplete="off" />
        <input id="email" placeholder="or Email" autocomplete="off" />
      </div>
      <div class="row">
        <input id="name" placeholder="Name (only needed if you're new)" autocomplete="off" />
      </div>
      <div class="err" id="err"></div>
      <button id="start">Start conversation</button>
      <div class="hint">
        Try the seeded returning customer: <code>+91-9876543210</code> (Priya — outdoor seating, vegetarian, has order history).
      </div>
    </div>
  </div>
</main>

<footer hidden id="footerEl">
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message the agent…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">Send</button>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = null;
let busy = false;

function addMessage(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "user" : "agent");
  el.innerHTML = `<div class="bubble"><div class="role">${role === "user" ? "you" : "agent"}</div>${escapeHtml(text)}</div>`;
  $("wrap").appendChild(el);
  scroll();
  return el;
}
function addSystem(text) {
  const el = document.createElement("div");
  el.className = "system";
  el.textContent = text;
  $("wrap").appendChild(el);
  scroll();
}
function addTrace(text) {
  const el = document.createElement("div");
  el.className = "trace";
  el.textContent = text;
  $("wrap").appendChild(el);
  scroll();
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function scroll() { document.querySelector("main").scrollTop = 1e9; }

async function start() {
  const phone = $("phone").value.trim();
  const email = $("email").value.trim();
  const name = $("name").value.trim();
  if (!phone && !email) { $("err").textContent = "Enter a phone or an email."; return; }
  $("start").disabled = true;
  $("err").textContent = "";
  try {
    const res = await fetch("/sessions", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ phone: phone || null, email: email || null, name: name || null }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Could not start session");
    sessionId = data.session_id;
    $("gate").remove();
    $("who").textContent = "· " + data.customer.name;
    $("footerEl").hidden = false;
    $("verboseWrap").hidden = false;
    $("reset").hidden = false;
    addSystem("Session started. What we remember:\n" + data.memory);
    $("input").focus();
  } catch (e) {
    $("err").textContent = e.message;
    $("start").disabled = false;
  }
}

async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text || busy || !sessionId) return;
  busy = true;
  $("send").disabled = true;
  input.value = "";
  input.style.height = "auto";
  addMessage("user", text);
  const pending = addMessage("agent", "");
  pending.querySelector(".bubble").innerHTML = `<div class="role">agent</div><span class="dots">thinking</span>`;
  try {
    const res = await fetch(`/sessions/${sessionId}/messages`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ content: text, verbose: $("verbose").checked }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Request failed");
    pending.querySelector(".bubble").innerHTML = `<div class="role">agent</div>${escapeHtml(data.reply)}`;
    if (data.trace) addTrace(data.trace);
  } catch (e) {
    pending.querySelector(".bubble").innerHTML = `<div class="role">agent</div>⚠️ ${escapeHtml(e.message)}`;
  } finally {
    busy = false;
    $("send").disabled = false;
    scroll();
    input.focus();
  }
}

$("start").addEventListener("click", start);
$("send").addEventListener("click", send);
$("reset").addEventListener("click", () => location.reload());
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px";
});
["phone", "email", "name"].forEach((id) =>
  $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") start(); }));
</script>
</body>
</html>
