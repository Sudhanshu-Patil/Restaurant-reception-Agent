<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Restaurant Reception Agent</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222c; --border: #2a2f3a;
    --text: #e7e9ee; --muted: #9aa3b2; --accent: #ff8a5c; --accent-2: #6ea8fe;
    --ok: #5fd08a; --err: #ff6b6b; --user: #26303f; --agent: #1c2530;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .who { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  label.toggle { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  button {
    background: var(--accent); color: #1a1206; border: 0; border-radius: 8px;
    padding: 9px 16px; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  button.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; overflow-y: auto; padding: 22px; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  .gate { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
  .gate h2 { margin: 0 0 6px; font-size: 17px; }
  .gate p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .gate .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .gate input {
    flex: 1; min-width: 180px; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 14px;
  }
  .gate .err { color: var(--err); font-size: 13px; min-height: 18px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .hint code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }

  .msg { display: flex; gap: 10px; }
  .msg .bubble { padding: 11px 14px; border-radius: 12px; max-width: 78%; word-wrap: break-word; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: var(--user); border: 1px solid var(--border); white-space: pre-wrap; }
  .msg.agent .bubble { background: var(--agent); border: 1px solid var(--border); }
  .msg .role { font-size: 11px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .04em; }
  .bubble > p { margin: 0 0 8px; }
  .bubble > *:last-child { margin-bottom: 0; }
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 4px 0 6px; font-size: 15px; }
  .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
  .bubble li { margin: 2px 0; }
  .bubble strong { color: #fff; }
  .bubble code { background: #0c0e13; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  .bubble table { border-collapse: collapse; margin: 6px 0; font-size: 13px; display: block; overflow-x: auto; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  .bubble th { background: #12151c; }
  .bubble a { color: var(--accent-2); }

  .activity { display: flex; flex-direction: column; gap: 4px; margin-left: 2px; }
  .chip {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 8px;
    background: #12151c; border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 11px; font-size: 12.5px; color: var(--muted);
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .chip.running .dot { background: var(--accent-2); animation: pulse 1s ease-in-out infinite; }
  .chip.ok .dot { background: var(--ok); }
  .chip.err .dot { background: var(--err); }
  .chip .detail { color: #cfd4de; }
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  .notice { color: var(--muted); font-size: 12px; font-style: italic; margin-left: 2px; }
  .system { text-align: center; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
  .trace {
    max-width: 100%; background: #12151c; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted); white-space: pre-wrap; overflow-x: auto;
  }

  footer { border-top: 1px solid var(--border); background: var(--panel); padding: 14px 20px; }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  .composer textarea {
    flex: 1; resize: none; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 11px 13px; font: inherit; max-height: 140px;
  }
</style>
</head>
<body>
<header>
  <h1>🍽️ Reception Agent</h1>
  <span class="who" id="who"></span>
  <span class="spacer"></span>
  <label class="toggle" id="verboseWrap" hidden><input type="checkbox" id="verbose" /> reasoning trace</label>
  <button class="ghost" id="reset" hidden>New session</button>
</header>

<main>
  <div class="wrap" id="wrap">
    <div class="gate" id="gate">
      <h2>Who's calling?</h2>
      <p>Identify by phone or email so the agent can pull up your preferences and history.</p>
      <div class="row">
        <input id="phone" placeholder="Phone (e.g. +91-9876543210)" autocomplete="off" />
        <input id="email" placeholder="or Email" autocomplete="off" />
      </div>
      <div class="row"><input id="name" placeholder="Name (only if you're new)" autocomplete="off" /></div>
      <div class="err" id="err"></div>
      <button id="start">Start conversation</button>
      <div class="hint">Returning customer: <code>+91-9876543210</code> (Priya — outdoor, vegetarian, has order history).</div>
    </div>
  </div>
</main>

<footer hidden id="footerEl">
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message the agent…  (Enter to send)"></textarea>
    <button id="send">Send</button>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let sessionId = null;
let busy = false;

function el(cls, parent) {
  const d = document.createElement("div");
  d.className = cls;
  (parent || $("wrap")).appendChild(d);
  scroll();
  return d;
}
function bubble(role, html) {
  const row = el("msg " + (role === "user" ? "user" : "agent"));
  row.innerHTML = `<div class="bubble"><div class="role">${role === "user" ? "you" : "agent"}</div>${html}</div>`;
  return row.querySelector(".bubble");
}
function system(text) { el("system").textContent = text; }
function scroll() { document.querySelector("main").scrollTop = 1e9; }
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// -- tiny safe markdown (escape first, then a small rule set) --
function mdInline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMarkdown(src) {
  const lines = escapeHtml(src).replace(/\r\n/g, "\n").split("\n");
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^\s*\|.*\|\s*$/.test(line) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
      close();
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      out.push("<table><thead><tr>" + cells(line).map((c) => `<th>${mdInline(c)}</th>`).join("") + "</tr></thead><tbody>");
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
        out.push("<tr>" + cells(lines[i]).map((c) => `<td>${mdInline(c)}</td>`).join("") + "</tr>"); i++;
      }
      i--; out.push("</tbody></table>"); continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { close(); out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); continue; }
    const ul = line.match(/^\s*[-*]\s+(.*)$/), ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol) {
      const want = ul ? "ul" : "ol";
      if (list !== want) { close(); out.push(`<${want}>`); list = want; }
      out.push(`<li>${mdInline((ul || ol)[1])}</li>`); continue;
    }
    if (line.trim() === "") { close(); continue; }
    close(); out.push(`<p>${mdInline(line)}</p>`);
  }
  close(); return out.join("");
}

async function start() {
  const phone = $("phone").value.trim(), email = $("email").value.trim(), name = $("name").value.trim();
  if (!phone && !email) { $("err").textContent = "Enter a phone or an email."; return; }
  $("start").disabled = true; $("err").textContent = "";
  try {
    const res = await fetch("/sessions", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ phone: phone || null, email: email || null, name: name || null }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Could not start session");
    sessionId = data.session_id;
    $("gate").remove();
    $("who").textContent = "· " + data.customer.name;
    $("footerEl").hidden = false; $("verboseWrap").hidden = false; $("reset").hidden = false;
    system("Session started. What we remember:\n" + data.memory);
    $("input").focus();
  } catch (e) { $("err").textContent = e.message; $("start").disabled = false; }
}

const CHIP_LABEL = {
  get_current_datetime: "checking the time", search_menu: "searching the menu",
  check_availability: "checking availability", book_table: "booking a table",
  create_reservation: "booking a table", change_reservation: "moving the reservation",
  cancel_reservation: "cancelling the reservation", list_my_reservations: "looking up reservations",
  add_items_to_reservation: "adding to the order", remove_order_item: "removing an item",
  list_order_history: "looking up past orders", remember_preference: "saving a preference",
};

async function send() {
  const input = $("input"), text = input.value.trim();
  if (!text || busy || !sessionId) return;
  busy = true; $("send").disabled = true;
  input.value = ""; input.style.height = "auto";
  bubble("user", escapeHtml(text));

  const activity = el("activity");
  const chips = {};
  let answered = false;

  try {
    const res = await fetch(`/sessions/${sessionId}/messages/stream`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ content: text }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const frames = buf.split("\n\n");
      buf = frames.pop();
      for (const frame of frames) handleEvent(frame, activity, chips, () => { answered = true; });
    }
  } catch (e) {
    bubble("agent", `⚠️ ${escapeHtml(e.message)}`);
  } finally {
    if (!activity.childElementCount) activity.remove();
    if (!answered) bubble("agent", "⚠️ The agent didn't return a reply.");
    busy = false; $("send").disabled = false; input.focus(); scroll();
  }
}

function handleEvent(frame, activity, chips, markAnswered) {
  const lines = frame.split("\n");
  const type = (lines.find((l) => l.startsWith("event:")) || "").slice(6).trim();
  const dataLine = (lines.find((l) => l.startsWith("data:")) || "data:{}").slice(5).trim();
  let data = {};
  try { data = JSON.parse(dataLine); } catch { return; }

  if (type === "tool_call") {
    const label = CHIP_LABEL[data.name] || data.name;
    const chip = el("chip running", activity);
    chip.innerHTML = `<span class="dot"></span><span>${escapeHtml(label)}</span>`;
    chips[data.name] = chip;
  } else if (type === "tool_result") {
    const chip = chips[data.name] || el("chip", activity);
    chip.className = "chip " + (data.ok ? "ok" : "err");
    const label = CHIP_LABEL[data.name] || data.name;
    const detail = data.message ? ` <span class="detail">— ${escapeHtml(data.message)}</span>` : "";
    chip.innerHTML = `<span class="dot"></span><span>${escapeHtml(label)}</span>${detail}`;
  } else if (type === "notice") {
    const n = el("notice", activity);
    n.textContent = data.text || "";
  } else if (type === "message") {
    markAnswered();
    bubble("agent", renderMarkdown(data.content || ""));
  } else if (type === "done") {
    if ($("verbose").checked && data.trace) {
      const t = el("trace"); t.textContent = data.trace;
    }
  } else if (type === "error") {
    bubble("agent", `⚠️ ${escapeHtml(data.message || "stream error")}`);
  }
}

$("start").addEventListener("click", start);
$("send").addEventListener("click", send);
$("reset").addEventListener("click", () => location.reload());
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px";
});
["phone", "email", "name"].forEach((id) => $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") start(); }));
</script>
</body>
</html>
